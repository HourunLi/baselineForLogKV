[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticlogkv-dms-baseline"
version = "0.1.0"
description = "Qwen3-1.7B-Base baselines for SemanticLogKV: NVIDIA DMS and ChunkKV"
requires-python = ">=3.10,<3.14"
dependencies = [
    "transformers==4.57.3",
    "accelerate==1.4.0",
    "PyYAML>=6.0",
    "torch>=2.7",
    "lightning>=2.6.1",
    "jsonargparse[signatures]>=4.37,<=4.41",
    "psutil>=5.9",
    "safetensors>=0.4.3",
    "tokenizers>=0.21",
    "sentencepiece>=0.2",
    "tqdm>4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]
train = ["datasets==4.4.2"]
eval = ["lm-eval[ruler,longbench,ifeval]==0.4.9", "datasets>=2.18,<4", "pandas>=1.9", "openpyxl>=3"]
# ChunkKV's bundled dense-CPT runtime uses these data and logging dependencies.
chunkkv-train = ["litdata==0.2.59", "tensorboard>=2.14", "datasets>=2.18", "pandas>=1.9", "pyarrow>=15.0.2"]

[tool.setuptools.packages.find]
include = ["dms*", "models*", "chunkkv*"]

[tool.setuptools.package-data]
"chunkkv._vendor.semanticlogkv" = ["LICENSE.md", "README.md", "SOURCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["cuda: requires CUDA and the official DMS kernels"]
filterwarnings = ["ignore:flex_attention called without torch.compile:UserWarning"]
