[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticlogkv-dms-baseline"
version = "0.1.0"
description = "Qwen3-1.7B-Base baselines for SemanticLogKV: NVIDIA DMS and ChunkKV"
requires-python = ">=3.10,<3.14"
dependencies = [
    "transformers==4.57.3",
    "accelerate==1.4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
train = ["datasets==4.4.2"]
eval = ["lm-eval[ruler]==0.4.9", "datasets>=2.18,<4", "pandas>=1.9", "openpyxl>=3"]
# ChunkKV dense-CPT control runs SemanticLogKV's demo.py; versions follow its litgpt extras.
chunkkv-train = ["litdata==0.2.59", "tensorboard>=2.14"]

[tool.setuptools.packages.find]
include = ["dms*", "models*", "chunkkv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["cuda: requires CUDA and the official DMS kernels"]
filterwarnings = ["ignore:flex_attention called without torch.compile:UserWarning"]
