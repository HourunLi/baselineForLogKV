[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticlogkv-chunkkv-baseline"
version = "0.1.0"
description = "Training-free ChunkKV on Qwen3-1.7B-Base under SemanticLogKV's evaluation protocol"
requires-python = ">=3.10,<3.14"
dependencies = [
    "PyYAML>=6.0",
    "torch>=2.7",
    "lightning>=2.6.1",
    "jsonargparse[signatures]>=4.37,<=4.41",
    "psutil>=5.9",
    "safetensors>=0.4.3",
    "tokenizers>=0.21",
    "sentencepiece>=0.2",
    "tqdm>4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Evaluation runs in SemanticLogKV's existing environment (torch218); install this project there with
# `pip install --no-deps -e .` so nothing in it changes. These are the requirements the code and the shared
# offline cache impose (its IFEval entry uses the Json feature type of datasets>=4.7); each run records the
# exact versions, and compare_results requires both sides to match. transformers comes with lm-eval.
eval = ["lm-eval[ruler,longbench,ifeval]==0.4.9", "datasets>=4.7", "pandas>=1.9", "openpyxl>=3"]
# Optional dense-CPT control only; install it in a separate training environment.
chunkkv-train = ["litdata==0.2.59", "tensorboard>=2.14", "datasets>=2.18", "pandas>=1.9", "pyarrow>=15.0.2"]

[tool.setuptools.packages.find]
include = ["chunkkv*"]

[tool.setuptools.package-data]
"chunkkv._vendor.semanticlogkv" = ["LICENSE.md", "README.md", "SOURCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
