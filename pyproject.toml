[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticlogkv-cam-baseline"
version = "0.1.0"
description = "Training-free online CaM on Qwen3-1.7B-Base under SemanticLogKV's evaluation protocol"
requires-python = ">=3.10,<3.14"
# PyTorch/CUDA comes from the prepared CUDA image. Lower bounds of what the code imports: SemanticLogKV's
# evaluation environment (torch218: transformers 4.51.3) satisfies all of them; evaluation runs there from the
# project root without installing this project, so nothing in it changes.
dependencies = [
    # Qwen3 model code used by CaM and the Base conversion (Qwen3 arrived in 4.51).
    "transformers>=4.51",
    "PyYAML>=6.0",
    # Bundled SemanticLogKV/LitGPT runtime (models/_vendor/semanticlogkv): same packages
    # that installing the sibling litgpt checkout used to pull in.
    "lightning>=2.6.1",
    "jsonargparse[signatures]>=4.37,<=4.41",
    "psutil>=5.9",
    "safetensors>=0.4.3",
    "tokenizers>=0.21",
    "tqdm>4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# For a separate environment only. The requirements the code and the shared offline cache impose (its IFEval
# entry uses the Json feature type of datasets>=4.7); models.cam.evaluate checks them at start-up and every
# result records the exact versions.
eval = ["lm-eval[ruler,longbench,ifeval]>=0.4.9", "datasets>=4.7", "pandas>=1.5", "xlsxwriter>=3"]

[tool.setuptools.packages.find]
include = ["models*"]

[tool.setuptools.package-data]
"models._vendor.semanticlogkv" = ["LICENSE.md", "README.md", "SOURCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
