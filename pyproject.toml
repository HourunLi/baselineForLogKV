[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-v4flash-baseline"
version = "0.1.0"
description = "DeepSeek V4-Flash attention on Qwen3-8B-Base with the niahLogKV evaluation protocol"
requires-python = ">=3.10,<3.14"
dependencies = [
    "PyYAML>=6.0",
    "torch>=2.7",
    # HybridCSA training data (torch218 has litdata 0.2.61 and pyarrow 23.0.1); training runs there too.
    "litdata>=0.2.59",
    "pyarrow>=15.0.2",
    "lightning>=2.6.1",
    "jsonargparse[signatures]>=4.37,<=4.41",
    "psutil>=5.9",
    "safetensors>=0.4.3",
    "tokenizers>=0.21",
    "tqdm>4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Evaluation runs in SemanticLogKV's existing environment (torch218) from the project root, without
# installing this project there, so nothing in it changes. These are the requirements the code and the shared
# offline cache impose (native List/Json in datasets 4.8.4); each run records the
# exact versions, and compare_results requires both sides to match. transformers comes with lm-eval.
eval = ["lm-eval[ruler,longbench,ifeval]>=0.4.11", "datasets>=4.8.4", "pyarrow>=21", "pandas>=1.9", "xlsxwriter>=3"]
# Optional dense-CPT control only; install it in a separate training environment.
chunkkv-train = ["litdata>=0.2.59", "tensorboard>=2.14", "datasets>=2.18", "pandas>=1.9", "pyarrow>=15.0.2"]

[tool.setuptools.packages.find]
include = ["deepseek4*", "chunkkv*", "hybrid_csa*"]

[tool.setuptools.package-data]
"deepseek4._vendor.niahlogkv" = ["LICENSE.md", "SOURCE.json", "eval_tasks/**/*.yaml", "eval_tasks/**/*.md", "eval_tasks/**/*.json"]
"chunkkv._vendor.semanticlogkv" = ["LICENSE.md", "README.md", "SOURCE.json"]
"hybrid_csa._vendor.semanticlogkv" = ["LICENSE.md", "README.md", "SOURCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
