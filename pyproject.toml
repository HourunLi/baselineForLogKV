[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticlogkv-dms-baseline"
version = "0.1.0"
description = "Qwen3-1.7B-Base with NVIDIA Dynamic Memory Sparsification"
requires-python = ">=3.10,<3.14"
# PyTorch/CUDA (and FlashAttention for inference) come from the environment. Lower bounds of what the code
# imports: SemanticLogKV's environment (torch218) meets all of them and none excludes a version it has, because
# training and evaluation both run there without installing this project. transformers>=4.51 is the first
# release with Qwen3; the newer APIs DMS uses come from dms.transformers_compat when the installed release lacks
# them, and dms.training.loop trains without HF Trainer/accelerate.
dependencies = [
    "transformers>=4.51",
    # Training data pipeline (dms.training.data); the evaluation cache needs 4.7 too (eval extra).
    "datasets>=4.7",
    "numpy>=1.26",
    "PyYAML>=6.0",
    # Bundled SemanticLogKV/LitGPT runtime (models/_vendor/semanticlogkv).
    "lightning>=2.6.1",
    "jsonargparse[signatures]>=4.37,<=4.41",
    "psutil>=5.9",
    "safetensors>=0.4.3",
    "tokenizers>=0.21",
    "tqdm>4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# For a separate environment only. These are what the code and the shared offline cache need (its IFEval
# entry uses the Json feature type of datasets>=4.7); each run records the exact versions, and compare_results
# requires both sides to match. transformers comes with lm-eval as well.
eval = ["lm-eval[ruler,longbench,ifeval]>=0.4.9", "datasets>=4.7", "pandas>=1.9", "xlsxwriter>=3"]

[tool.setuptools.packages.find]
include = ["dms*", "models*"]

[tool.setuptools.package-data]
"models._vendor.semanticlogkv" = ["LICENSE.md", "README.md", "SOURCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["cuda: requires CUDA and the official DMS kernels"]
filterwarnings = ["ignore:flex_attention called without torch.compile:UserWarning"]
