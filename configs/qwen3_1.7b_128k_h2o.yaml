# Streaming H2O on the original Qwen3-1.7B-Base at SemanticLogKV's 128k long-context protocol, same memory.
# Keys are evaluate.py option names; command-line options override them. majob.sh runs the 'long' suite
# (BABILong, long-document perplexity) and then the 'ruler' suite (13 RULER tasks) for this context.
model: /home/ma-user/work/bucket-pangu-green/lihourun/checkpoints/Qwen/Qwen3-1.7B-Base/
context: 128k                   # window, YaRN and RULER length from configs/eval_suites.yaml
hf_cache_base: /home/ma-user/work/bucket-pangu-green/lihourun/data/hf_cache
# PG19's test books, as in SemanticLogKV's long-context runs (LONG_PPL_DATA in the environment wins).
long_ppl_data: /home/ma-user/work/bucket-pangu-green/lihourun/data/hf_cache/hub/datasets--emozilla--pg19-test/snapshots/c5e39bf32e33f9111323aa68d7d9000d22722035

method: h2o
streaming: true                # evict after every prompt chunk and decode step: never more than budget + one chunk
prefill_chunk_size: 2048       # tokens per forward through the model (SemanticLogKV's prefill_block)
# Persistent bytes of the LogKV cache the comparison run allocates at this window, measured with SemanticLogKV's
# eval_long128k_baseline.yaml: 2,403,505,664 bytes (85,839,488 per layer x 28). Each kept entry costs K + V (bf16) and an fp32 score per KV head.
budget_bytes: 2403505664
window_size: half              # original H2O: heavy hitters and recent tokens share the budget
score_chunk_size: 256          # queries per scoring block (memory only, same result)
kv_cache_granularity: kv_head
gqa_score_agg: mean
