# Synthetic text, two steps: checks execution only, not model quality.
model:
  name: outputs/semanticlogkv_base
  dtype: float32
  forward_fn_kwargs:
    train_attn_kwargs:
      kernel_options:
        BLOCK_M1: 16
        BLOCK_M2: 16
        BLOCK_N1: 16
        BLOCK_N2: 16
dms:
  alpha_scale: 100.0
  initial_alpha_offset: 5.0
  window_size: 512
  disable_eviction: false
  separate_alpha: true
  alpha_per: head
  tau: 0.1
  initial_cr: 1.0
  final_cr: 2.0
  final_step: 1
data:
  train_samples: 32
  max_length: 1024
  concat_always_start_new: false
  process_vocab_using_chunk: 4096
  tokenizer_kwargs:
    chat_template: '{{ messages | map(attribute=''content'') | join(''\n\n'') }}{{
      eos_token }}'
  train_file: tests/fixtures/smoke.jsonl
# dms.training.loop.TrainerSettings: HF TrainingArguments names and meanings; values it does not
# implement are refused.
trainer:
  output_dir: outputs/qwen3_1.7b_base_smoke
  run_name: dms_qwen3_1.7b_base_smoke
  max_steps: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-05
  weight_decay: 0.0
  warmup_steps: 0
  lr_scheduler_type: constant
  save_strategy: steps
  save_steps: 1
  save_total_limit: 2
  logging_strategy: steps
  logging_steps: 1
  gradient_checkpointing: false
  tf32: false
  bf16: true
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_grad_norm: 1.0
  seed: 42
  fsdp: ''
  resume_from_checkpoint: null
  report_to: none
