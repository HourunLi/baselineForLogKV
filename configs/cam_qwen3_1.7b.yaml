# Training-free online CaM on the original Qwen3-1.7B-Base exported by models.qwen3.prepare_base.
model: outputs/semanticlogkv_base
# Project-owned files only: original Base, 32K window and LogKV control settings; task lists
# (47 main + 3 NIAH entries, NIAH at [32768]). Relative paths are resolved from the project root.
experiment_config: configs/experiment_qwen1.7b_32k.yaml
evaluation_config: configs/eval_suites.yaml
seed: 42
prefill_chunk_size: 256
# 2,048 retained entries are an initial comparison point, not equal allocated bytes.
start_size: 32
recent_size: 2016
merge_size: 16
