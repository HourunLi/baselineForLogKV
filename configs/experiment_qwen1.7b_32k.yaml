# Project-owned snapshot of the SemanticLogKV experiment this baseline is compared with.
# Source: HourunLi/LogKV 4fd97c78e04f0ec96ad6aed18df9e9cf440c6090,
#   exp/qwen1.7b-32k/arc_attach_alpha_beta_k12_b128_2k.yaml -> arc_semantic_fast -> base (flattened).
# No cross-project YAML is read at runtime. Kept fields: the original Base (ckpt_dir) that
# prepare_base converts and that supplies the tokenizer/NIAH metadata, the 32K window, and the
# SemanticLogKV method parameters used only by the --backend logkv control. Training fields of
# the SemanticLogKV CPT run are omitted: CaM is training-free and evaluates the original Base.
# Override a relocated Base with CAM_BASE_CHECKPOINT.
arch_name: Qwen/Qwen3-1.7B-Base
context_length: 32768
expid: qwen1.7b-32k-attach-alpha-beta_k12_b128_2k
ckpt_dir: ${CAM_BASE_CHECKPOINT-/home/ma-user/work/bucket-pangu-green/lihourun/checkpoints/Qwen/Qwen3-1.7B-Base/}
log_kv_B: 128
log_kv_recent_size: 2048
log_kv_train_block: 2048
